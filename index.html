<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>GS SOLDAS - Catálogo</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#20262d;
}

header{
    background:#20262d;
    color:white;
    padding:20px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.logo span{
    display:block;
    font-size:11px;
    color:#aaa;
    margin-top:4px;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 16px;
    font-weight:bold;
    cursor:pointer;
}

.admin{
    background:white;
    color:#20262d;
}

.primary{
    background:#e86b20;
    color:white;
}

.danger{
    background:#ffe0e0;
    color:#a00000;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
}

.hero{
    padding:40px 0 20px;
}

.hero h1{
    margin:0 0 8px;
    font-size:34px;
}

.hero p{
    color:#69747d;
}

.search{
    width:100%;
    padding:15px;
    border:1px solid #d5dbe0;
    border-radius:10px;
    font-size:15px;
    margin:20px 0;
}

.filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.filter{
    background:white;
    border:1px solid #d5dbe0;
}

.filter.active{
    background:#20262d;
    color:white;
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(240px,1fr));
    gap:18px;
    padding-bottom:40px;
}

.card{
    background:white;
    border-radius:14px;
    overflow:hidden;
    border:1px solid #e0e4e8;
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    transform:translateY(-4px);
}

.image{
    height:190px;
    background:#e9edf0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#89939b;
}

.image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.content{
    padding:17px;
}

.category{
    color:#e86b20;
    font-size:11px;
    font-weight:bold;
    text-transform:uppercase;
}

.content h3{
    margin:7px 0;
}

.muted{
    color:#69747d;
    font-size:13px;
}

.empty{
    background:white;
    border:1px dashed #ccd3d9;
    border-radius:14px;
    padding:60px 20px;
    text-align:center;
    margin-bottom:40px;
}

.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:20;
    padding:20px;
    overflow:auto;
}

.modal{
    background:white;
    max-width:760px;
    margin:30px auto;
    border-radius:15px;
    padding:25px;
}

.login-modal{
    max-width:420px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

.field input,
.field textarea{
    width:100%;
    padding:11px;
    border:1px solid #d7dde2;
    border-radius:8px;
    font-family:inherit;
}

.field textarea{
    min-height:100px;
    resize:vertical;
}

.actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

.admin-item{
    border:1px solid #dce1e5;
    border-radius:10px;
    padding:14px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:10px;
}

.admin-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    align-items:center;
}

.detail-image{
    width:100%;
    max-height:350px;
    object-fit:contain;
    background:#eef1f3;
    border-radius:10px;
    margin:15px 0;
}

.specs{
    width:100%;
    border-collapse:collapse;
}

.specs td{
    padding:10px;
    border-bottom:1px solid #e1e5e8;
}

.specs td:first-child{
    font-weight:bold;
    width:35%;
}

.login-message{
    background:#f3f4f6;
    padding:12px;
    border-radius:8px;
    margin-bottom:18px;
    font-size:13px;
    color:#69747d;
}

.error-message{
    color:#b00020;
    font-size:13px;
    margin-top:8px;
    display:none;
}

.duplicate{
    background:#eef5ff;
    color:#174a8b;
}

@media(max-width:650px){

    header{
        padding:16px 5%;
    }

    .hero h1{
        font-size:27px;
    }

    .row{
        grid-template-columns:1fr;
    }

    .admin-item{
        flex-direction:column;
    }

}

</style>

</head>

<body>


<!-- =====================================================
     CABEÇALHO
===================================================== -->

<header>

<div class="logo">

GS SOLDAS

<span>
Produtos e especificações
</span>

</div>


<button
    class="admin"
    onclick="abrirLogin()"
>

⚙ Administração

</button>

</header>



<!-- =====================================================
     CATÁLOGO
===================================================== -->

<main class="container">

<section class="hero">

<h1>
Catálogo de Produtos
</h1>

<p>
Consulte nossos produtos e suas especificações.
</p>


<input
    id="pesquisa"
    class="search"
    placeholder="🔎 Pesquisar produto, marca ou código..."
    oninput="mostrarProdutos()"
>


<div
    id="filtros"
    class="filters"
></div>

</section>


<section
    id="catalogo"
></section>

</main>



<!-- =====================================================
     LOGIN
===================================================== -->

<div
    id="loginOverlay"
    class="overlay"
>

<div
    class="modal login-modal"
>

<div class="modal-header">

<h2>
🔐 Administração
</h2>

<button
    onclick="fecharLogin()"
>
✕
</button>

</div>


<br>


<div class="login-message">

Área restrita do administrador.

Digite sua senha para continuar.

</div>


<div class="field">

<label>
Senha
</label>


<input
    id="senhaAdmin"
    type="password"
    placeholder="Digite a senha"
    autocomplete="current-password"
    onkeydown="if(event.key==='Enter') entrarAdmin()"
>


<div
    id="loginErro"
    class="error-message"
>
Senha incorreta.
</div>

</div>


<div class="actions">

<button
    onclick="fecharLogin()"
>
Cancelar
</button>


<button
    class="primary"
    onclick="entrarAdmin()"
>
Entrar
</button>

</div>

</div>

</div>



<!-- =====================================================
     ADMIN
===================================================== -->

<div
    id="adminOverlay"
    class="overlay"
>

<div class="modal">

<div class="modal-header">

<h2>
Administração
</h2>


<button
    onclick="fecharAdmin()"
>
✕
</button>

</div>


<br>


<button
    class="primary"
    onclick="novoProduto()"
>
＋ Novo produto
</button>


<div
    id="listaAdmin"
></div>

</div>

</div>



<!-- =====================================================
     FORMULÁRIO
===================================================== -->

<div
    id="formOverlay"
    class="overlay"
>

<div class="modal">

<div class="modal-header">

<h2 id="tituloFormulario">
Novo produto
</h2>


<button
    onclick="fecharFormulario()"
>
✕
</button>

</div>


<input
    type="hidden"
    id="produtoId"
>


<br>


<div class="row">


<div class="field">

<label>
Nome do produto *
</label>

<input
    id="nome"
    placeholder="Ex.: Primer PU"
>

</div>


<div class="field">

<label>
Código
</label>

<input
    id="codigo"
    placeholder="Ex.: PR-001"
>

</div>

</div>



<div class="row">


<div class="field">

<label>
Categoria
</label>

<input
    id="categoria"
    placeholder="Ex.: Pintura Automotiva"
>

</div>


<div class="field">

<label>
Marca
</label>

<input
    id="marca"
>

</div>

</div>



<div class="field">

<label>
Descrição
</label>

<textarea
    id="descricao"
></textarea>

</div>



<div class="field">

<label>
Especificações
</label>

<textarea
    id="especificacoes"
    placeholder="Volume: 900 ml
Acabamento: Fosco
Aplicação: Automotiva"
></textarea>

</div>



<div class="field">

<label>
URL da imagem
</label>

<input
    id="imagem"
    placeholder="https://..."
>

</div>



<div class="actions">

<button
    onclick="fecharFormulario()"
>
Cancelar
</button>


<button
    class="primary"
    onclick="salvarProduto()"
>
Salvar produto
</button>

</div>

</div>

</div>



<!-- =====================================================
     DETALHES
===================================================== -->

<div
    id="detalhesOverlay"
    class="overlay"
>

<div
    class="modal"
    id="detalhes"
></div>

</div>



<script>


/* =====================================================
   VARIÁVEIS
===================================================== */

let produtos = [];

let categoriaAtual = "Todos";

let adminAuth = null;



/* =====================================================
   CARREGAR PRODUTOS
===================================================== */

async function carregarProdutos(){

try{

const resposta =
await fetch("/api/produtos");


if(!resposta.ok){

throw new Error();

}


produtos =
await resposta.json();


mostrarProdutos();

mostrarListaAdmin();


}catch(error){

document.getElementById(
    "catalogo"
).innerHTML = `

<div class="empty">

<strong>
Não foi possível carregar os produtos.
</strong>

<br><br>

A API ainda não está configurada.

</div>

`;

}

}



/* =====================================================
   ESCAPAR TEXTO
===================================================== */

function escapar(texto=""){

return String(texto).replace(
    /[&<>"']/g,

    caractere => ({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

    }[caractere])

);

}



/* =====================================================
   CATEGORIAS
===================================================== */

function obterCategorias(){

return [

"Todos",

...new Set(

produtos
.map(p => p.categoria)
.filter(Boolean)

)

];

}


function mostrarFiltros(){

document.getElementById(
    "filtros"
).innerHTML =

obterCategorias()
.map(categoria => `

<button
    class="filter ${
        categoria === categoriaAtual
        ? "active"
        : ""
    }"
    onclick='categoriaAtual=${JSON.stringify(categoria)};mostrarProdutos()'
>

${escapar(categoria)}

</button>

`)
.join("");

}



/* =====================================================
   MOSTRAR PRODUTOS
===================================================== */

function mostrarProdutos(){

mostrarFiltros();


const pesquisa =
document
.getElementById("pesquisa")
.value
.toLowerCase();


const lista =
produtos.filter(produto => {


const categoriaOK =

categoriaAtual === "Todos" ||

produto.categoria === categoriaAtual;


const texto = [

produto.nome,
produto.marca,
produto.codigo,
produto.categoria,
produto.descricao

]
.join(" ")
.toLowerCase();


return categoriaOK &&
texto.includes(pesquisa);

});



if(!lista.length){

document.getElementById(
    "catalogo"
).innerHTML = `

<div class="empty">

<strong>
Nenhum produto cadastrado.
</strong>

<br><br>

Abra ⚙ Administração para adicionar um produto.

</div>

`;

return;

}



document.getElementById(
    "catalogo"
).innerHTML = `

<div class="grid">

${lista.map(produto => `

<article
    class="card"
    onclick="abrirDetalhes(${produto.id})"
>

<div class="image">

${
produto.imagem

?

`<img
    src="${escapar(produto.imagem)}"
    alt="${escapar(produto.nome)}"
>`

:

"Sem imagem"

}

</div>


<div class="content">

<div class="category">

${escapar(
    produto.categoria ||
    "Sem categoria"
)}

</div>


<h3>

${escapar(produto.nome)}

</h3>


<div class="muted">

${escapar(
    produto.marca || ""
)}

${
produto.codigo
?
" • " +
escapar(produto.codigo)
:
""
}

</div>

</div>

</article>

`).join("")}

</div>

`;

}



/* =====================================================
   LOGIN
===================================================== */

function abrirLogin(){

document.getElementById(
    "loginOverlay"
).style.display =
"block";


document.getElementById(
    "senhaAdmin"
).value =
"";


document.getElementById(
    "loginErro"
).style.display =
"none";


setTimeout(() => {

document.getElementById(
    "senhaAdmin"
).focus();

},100);

}


function fecharLogin(){

document.getElementById(
    "loginOverlay"
).style.display =
"none";

}



/* =====================================================
   ENTRAR NO ADMIN
===================================================== */

async function entrarAdmin(){

const senha =
document.getElementById(
    "senhaAdmin"
).value;


const erro =
document.getElementById(
    "loginErro"
);


if(!senha){

erro.textContent =
"Digite a senha.";

erro.style.display =
"block";

return;

}


const auth =
"Basic " +
btoa(
    "admin:" + senha
);


try{


const resposta =
await fetch(
    "/api/admin/teste",
    {

        method:"GET",

        headers:{
            "Authorization":auth
        }

    }
);



if(!resposta.ok){

erro.textContent =
"Senha incorreta.";

erro.style.display =
"block";

return;

}


adminAuth =
auth;


fecharLogin();

abrirAdmin();


}catch(error){

erro.textContent =
"Erro ao verificar a senha.";

erro.style.display =
"block";

}

}



/* =====================================================
   ABRIR ADMIN
===================================================== */

function abrirAdmin(){

if(!adminAuth){

abrirLogin();

return;

}


document.getElementById(
    "adminOverlay"
).style.display =
"block";


mostrarListaAdmin();

}


function fecharAdmin(){

document.getElementById(
    "adminOverlay"
).style.display =
"none";

}



/* =====================================================
   LISTA ADMIN
===================================================== */

function mostrarListaAdmin(){

const lista =
document.getElementById(
    "listaAdmin"
);


if(!produtos.length){

lista.innerHTML = `

<div class="empty">

Nenhum produto cadastrado.

</div>

`;

return;

}



lista.innerHTML =

produtos.map(produto => `

<div class="admin-item">

<div>

<strong>

${escapar(
    produto.nome
)}

</strong>


<div class="muted">

${escapar(
    produto.categoria ||
    "Sem categoria"
)}

</div>

</div>



<div class="admin-actions">


<!-- EDITAR -->

<button
    onclick="editarProduto(${produto.id})"
>

✏️ Editar

</button>



<!-- NOVO BOTÃO DUPLICAR -->

<button
    class="duplicate"
    onclick="duplicarProduto(${produto.id})"
>

📋 Duplicar

</button>



<!-- EXCLUIR -->

<button
    class="danger"
    onclick="excluirProduto(${produto.id})"
>

🗑️ Excluir

</button>


</div>

</div>

`)
.join("");

}



/* =====================================================
   NOVO PRODUTO
===================================================== */

function novoProduto(){

abrirFormulario({

id:"",
nome:"",
codigo:"",
categoria:"",
marca:"",
descricao:"",
especificacoes:"",
imagem:""

});

}



/* =====================================================
   EDITAR PRODUTO
===================================================== */

function editarProduto(id){

if(!adminAuth){

abrirLogin();

return;

}


const produto =
produtos.find(
    p => p.id == id
);


if(produto){

abrirFormulario(produto);

}

}



/* =====================================================
   DUPLICAR PRODUTO
===================================================== */

function duplicarProduto(id){

if(!adminAuth){

abrirLogin();

return;

}


const produto =
produtos.find(
    p => p.id == id
);


if(!produto){

return;

}


/*
   IMPORTANTE:

   Não copiamos o ID.

   O novo produto precisa receber
   um novo ID do banco de dados.

   Todas as outras informações são
   copiadas, inclusive a imagem.
*/


abrirFormulario({

id:"",

nome:produto.nome,

codigo:produto.codigo,

categoria:produto.categoria,

marca:produto.marca,

descricao:produto.descricao,

especificacoes:produto.especificacoes,

imagem:produto.imagem

});


/*
   Alteramos o título para deixar
   claro que estamos criando uma cópia.
*/

document.getElementById(
    "tituloFormulario"
).textContent =
"Duplicar produto";

}



/* =====================================================
   ABRIR FORMULÁRIO
===================================================== */

function abrirFormulario(produto){

document.getElementById(
    "produtoId"
).value =
produto.id;


document.getElementById(
    "tituloFormulario"
).textContent =

produto.id
?
"Editar produto"
:
"Novo produto";


document.getElementById(
    "nome"
).value =
produto.nome ||
"";


document.getElementById(
    "codigo"
).value =
produto.codigo ||
"";


document.getElementById(
    "categoria"
).value =
produto.categoria ||
"";


document.getElementById(
    "marca"
).value =
produto.marca ||
"";


document.getElementById(
    "descricao"
).value =
produto.descricao ||
"";


document.getElementById(
    "especificacoes"
).value =
produto.especificacoes ||
"";


document.getElementById(
    "imagem"
).value =
produto.imagem ||
"";


document.getElementById(
    "formOverlay"
).style.display =
"block";

}


function fecharFormulario(){

document.getElementById(
    "formOverlay"
).style.display =
"none";

}



/* =====================================================
   SALVAR PRODUTO
===================================================== */

async function salvarProduto(){

if(!adminAuth){

fecharFormulario();

abrirLogin();

return;

}


const id =
document.getElementById(
    "produtoId"
).value;


const produto = {

nome:
document.getElementById(
    "nome"
).value.trim(),

codigo:
document.getElementById(
    "codigo"
).value.trim(),

categoria:
document.getElementById(
    "categoria"
).value.trim(),

marca:
document.getElementById(
    "marca"
).value.trim(),

descricao:
document.getElementById(
    "descricao"
).value.trim(),

especificacoes:
document.getElementById(
    "especificacoes"
).value.trim(),

imagem:
document.getElementById(
    "imagem"
).value.trim()

};



if(!produto.nome){

alert(
    "Informe o nome do produto."
);

return;

}



try{


const resposta =
await fetch(

id
?
"/api/produtos/" + id
:
"/api/produtos",

{

method:
id
?
"PUT"
:
"POST",

headers:{

"Content-Type":
"application/json",

"Authorization":
adminAuth

},

body:
JSON.stringify(produto)

}

);



if(!resposta.ok){


if(resposta.status === 401){

adminAuth =
null;


fecharFormulario();


abrirLogin();


alert(
    "Sua sessão expirou. Digite a senha novamente."
);


return;

}


throw new Error();

}



fecharFormulario();


await carregarProdutos();


mostrarListaAdmin();



}catch(error){

alert(
    "Erro ao salvar produto."
);

}

}



/* =====================================================
   EXCLUIR
===================================================== */

async function excluirProduto(id){

if(!adminAuth){

abrirLogin();

return;

}


if(!confirm(
    "Tem certeza que deseja excluir este produto?"
)){

return;

}



try{


const resposta =
await fetch(

"/api/produtos/" + id,

{

method:"DELETE",

headers:{

"Authorization":
adminAuth

}

}

);



if(!resposta.ok){


if(resposta.status === 401){

adminAuth =
null;


abrirLogin();


alert(
    "Sua sessão expirou. Digite a senha novamente."
);


return;

}


throw new Error();

}



await carregarProdutos();


mostrarListaAdmin();



}catch(error){

alert(
    "Erro ao excluir produto."
);

}

}



/* =====================================================
   DETALHES DO PRODUTO
===================================================== */

function abrirDetalhes(id){

const produto =
produtos.find(
    p => p.id == id
);


if(!produto){

return;

}



const especificacoes =
(produto.especificacoes || "")
.split("\n")
.filter(Boolean);



const tabela =
especificacoes.map(linha => {


const partes =
linha.split(":");


const nome =
partes.shift();


const valor =
partes.join(":");


return `

<tr>

<td>
${escapar(nome)}
</td>

<td>
${escapar(valor)}
</td>

</tr>

`;

})
.join("");



document.getElementById(
    "detalhes"
).innerHTML = `

<div class="modal-header">

<h2>

${escapar(
    produto.nome
)}

</h2>


<button
    onclick="fecharDetalhes()"
>

✕

</button>

</div>



${
produto.imagem

?

`<img
    class="detail-image"
    src="${escapar(produto.imagem)}"
    alt="${escapar(produto.nome)}"
>`

:

""

}



<p class="muted">

${escapar(
    produto.categoria ||
    ""
)}


${
produto.marca

?

" • " +
escapar(produto.marca)

:

""
}


${
produto.codigo

?

" • " +
escapar(produto.codigo)

:

""
}

</p>



<h3>
Descrição
